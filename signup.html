<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - BeatFlow</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'DM Sans',sans-serif;
  background:#0a0a14;
  color:#fff;
  display:flex;
  height:100vh;
}

/* BACKGROUND */
.bg {
  position: fixed;
  inset: 0;
  z-index: -1;
}

.circle {
  position: absolute;
  width: 200px;
  height: 200px;
  border-radius: 50%;
  background: rgba(192,132,252,0.4);
  filter: blur(40px);
  animation: updown 5s infinite ease-in-out;
}

.c1 { left: 10%; top: 70%; }
.c2 { left: 40%; top: 80%; animation-delay: 1s; }
.c3 { left: 70%; top: 75%; animation-delay: 1s; }
.c4 { left: 85%; top: 65%; animation-delay: 1s; }

@keyframes updown {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-100px); }
}

/* SPLIT */
.wrapper{
  display:flex;
  width:100%;
}

/* LEFT SIDE */
.left{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:15px;
}

/* ANIMATED TITLE */
.title{
  display:flex;
}

.letter{
  font-family:'Syne';
  font-size:70px;
  font-weight:800;
  opacity:0;
  transform:translateY(40px);
  animation:letterIn 0.5s ease forwards;
}

.letter.purple{
  color:#c084fc;
}

@keyframes letterIn{
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.tag{
  font-size:14px;
  color:#888;
  letter-spacing:3px;
}

/* RIGHT SIDE */
.right{
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* SIGNUP BOX */
.container{
  width:420px;
  padding:40px;
  background:rgba(20,20,35,0.85);
  border-radius:18px;
  border:1px solid rgba(255,255,255,0.08);
  backdrop-filter:blur(20px);
}

h2{
  font-family:'Syne';
  text-align:center;
  margin-bottom:20px;
  font-size:26px;
}

input{
  width:100%;
  padding:14px;
  margin-bottom:15px;
  border-radius:10px;
  border:none;
  background:#111118;
  color:#fff;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:30px;
  background:linear-gradient(135deg,#c084fc,#818cf8);
  color:white;
  font-weight:bold;
  cursor:pointer;
}

p{
  text-align:center;
  margin-top:12px;
}

a{color:#c084fc;}

/* RESPONSIVE */
@media(max-width:768px){
  .wrapper{
    flex-direction:column;
  }
}
/* ========================= */
/* 📱 RESPONSIVE DESIGN */
/* ========================= */

/* Tablet */
@media (max-width: 1024px) {

  .letter {
    font-size: 50px;
  }

  .container {
    width: 360px;
    padding: 30px;
  }

  h2 {
    font-size: 22px;
  }
}

/* Mobile */
@media (max-width: 768px) {

  body {
    height: auto;
  }

  .wrapper {
    flex-direction: column;
    align-items: center;
    padding: 30px 20px;
    gap: 30px;
  }

  .left {
    order: 1;
    text-align: center;
  }

  .right {
    order: 2;
    width: 100%;
  }

  .container {
    width: 100%;
    max-width: 380px;
  }

  .letter {
    font-size: 40px;
  }

  .tag {
    font-size: 12px;
    letter-spacing: 2px;
  }
}

/* Small Mobile */
@media (max-width: 480px) {

  .letter {
    font-size: 30px;
  }

  .container {
    padding: 25px;
  }

  input {
    padding: 12px;
    font-size: 13px;
  }

  button {
    padding: 12px;
    font-size: 14px;
  }

  h2 {
    font-size: 20px;
  }
}
</style>
</head>

<body>

<div class="bg">
  <div class="circle c1"></div>
  <div class="circle c2"></div>
  <div class="circle c3"></div>
  <div class="circle c4"></div>
</div>

<div class="wrapper">

  <!-- LEFT -->
  <div class="left">
    <div class="title" id="title"></div>
    <div class="tag">PREMIUM SOUND • PURE FLOW</div>
  </div>

  <!-- RIGHT -->
  <div class="right">
    <div class="container">
      <h2>Create Account</h2>

      <input type="email" id="email" placeholder="Email">
      <input type="text" id="username" placeholder="Username">
      <input type="password" id="password" placeholder="Password">

      <button onclick="signup()">Sign Up</button>

      <p>Already have an account? <a href="login.html">Login</a></p>
    </div>
  </div>

</div>

<script>

var word = "BEATFLOW";
var titleEl = document.getElementById('title');

for (var i = 0; i < word.length; i++) {
  var span = document.createElement('span');
  span.className = i >= 4 ? 'letter purple' : 'letter';
  span.textContent = word[i];
  span.style.animationDelay = (i * 0.08) + 's';
  titleEl.appendChild(span);
}

function signup(){
  const username=document.getElementById("username").value
  const password=document.getElementById("password").value

  if(!username || !password){
    alert("Enter all fields")
    return
  }

  localStorage.setItem("user", JSON.stringify({username,password}))
  localStorage.removeItem("isLoggedIn")

  window.location.href="login.html"
}
</script>

</body>
</html>
