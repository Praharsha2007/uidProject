<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BeatFlow</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&display=swap" rel="stylesheet"/>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #0d0d1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Syne', sans-serif;
      overflow: hidden;
      position: relative;
    }

    .orb1 {
      position: fixed;
      width: 500px;
      height: 500px;
      background: rgba(124, 58, 237, 0.18);
      border-radius: 50%;
      top: -150px;
      right: -100px;
      filter: blur(100px);
      pointer-events: none;
    }

    .orb2 {
      position: fixed;
      width: 350px;
      height: 350px;
      background: rgba(192, 132, 252, 0.12);
      border-radius: 50%;
      bottom: -100px;
      left: 50px;
      filter: blur(90px);
      pointer-events: none;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
      opacity: 0;
      animation: fadeUp 0.5s ease 0.1s forwards;
      position: relative;
    }

    .logo-icon {
      width: 42px;
      height: 42px;
      background: #c084fc;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .logo-name {
      font-size: 17px;
      font-weight: 800;
      color: #f1f0ff;
      display: block;
    }

    .logo-name span {
      color: #c084fc;
    }

    .logo-tag {
      font-size: 10px;
      color: #6b6b8a;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      display: block;
    }

    .title {
      display: flex;
      position: relative;
    }

    .letter {
      font-size: 120px;
      font-weight: 800;
      color: #f1f0ff;
      display: inline-block;
      opacity: 0;
      transform: translateY(50px);
      animation: letterIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      letter-spacing: -2px;
      line-height: 1;
    }

    .letter.purple {
      color: #c084fc;
    }

    .subtitle {
      font-size: 12px;
      color: #6b6b8a;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      font-family: monospace;
      margin-top: 16px;
      opacity: 0;
      animation: fadeUp 0.5s ease 1.1s forwards;
      position: relative;
    }

    @keyframes letterIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <div class="orb1"></div>
  <div class="orb2"></div>

  <div class="logo">
    <div class="logo-icon">🎵</div>
    <div>
      <span class="logo-name">Beat<span>Flow</span></span>
      <span class="logo-tag">Premium Sound</span>
    </div>
  </div>

  <div class="title" id="title"></div>

  <p class="subtitle">Premium Sound  Pure Flow</p>

  <script>
    var word = "BEATFLOW";
    var titleEl = document.getElementById('title');

    for (var i = 0; i < word.length; i++) {
      var span = document.createElement('span');
      span.className = i >= 4 ? 'letter purple' : 'letter';
      span.textContent = word[i];
      span.style.animationDelay = (0.15 + i * 0.08) + 's';
      titleEl.appendChild(span);
    }

    setTimeout(() => {
      const user = localStorage.getItem("user");

      if (!user) {
        window.location.href = "signup.html";
      } else {
        window.location.href = "login.html";
      }
    }, 5000);
  </script>

</body>
</html>
