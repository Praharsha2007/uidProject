<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BeatFlow — Contact</title>

  <!-- SAME CSS -->
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/player.css">

  <!-- FONTS -->
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

  <!-- REACT -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      margin: 0;
      background: #0a0a14;
      color: white;
      font-family: 'DM Sans', sans-serif;
    }

    .app-layout {
      display: flex;
      min-height: 100vh;
    }

    /* 🔥 FIXED ALIGNMENT */
    .main-content {
      flex: 1;
      padding: 40px 80px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .contact-container {
      display: flex;
      gap: 80px;
      width: 100%;
      max-width: 1200px;
      align-items: center;
      justify-content: space-between;
    }

    .left-section h1 {
      font-family: 'Syne', sans-serif;
      font-size: 48px;
      line-height: 1.2;
    }

    .left-section span {
      color: #c084fc;
    }

    .left-section p {
      color: rgba(255,255,255,0.5);
      margin-top: 10px;
    }

    .form-box {
      width: 420px;
      margin-left: auto; /* 🔥 pushes right */
      background: rgba(255,255,255,0.04);
      border-radius: 16px;
      padding: 30px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .form-box h3 {
      margin-bottom: 20px;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px;
      margin-bottom: 14px;
      border-radius: 8px;
      border: none;
      background: #111118;
      color: white;
      font-size: 14px;
    }

    textarea {
      height: 100px;
      resize: none;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      border-radius: 50px;
      border: none;
      background: linear-gradient(135deg, #c084fc, #818cf8);
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .submit-btn:hover {
      transform: scale(1.03);
    }
  </style>
</head>

<body>

<div class="app-layout">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="logo">
      <div class="logo-icon">🎵</div>
      <div class="logo-text">
        <h2>BeatFlow</h2>
        <p>Premium Sound</p>
      </div>
    </div>

    <span class="nav-label">Menu</span>

    <ul class="menu">
      <li onclick="location.href='index.html'">
        <span class="menu-icon">🏠</span> Home
      </li>

      <li onclick="location.href='index.html'">
        <span class="menu-icon">🎵</span> Library
      </li>

      <li onclick="location.href='about.html'">
        <span class="menu-icon">📈</span> About
      </li>

      <li class="active">
        <span class="menu-icon">✉️</span> Contact
      </li>
    </ul>
  </div>

  <!-- MAIN -->
  <div class="main-content">
    <div id="root"></div>
  </div>

</div>

<!-- REACT -->
<script type="text/babel">

function ContactPage() {
  const [name, setName] = React.useState("")
  const [email, setEmail] = React.useState("")
  const [topic, setTopic] = React.useState("General Inquiry")
  const [message, setMessage] = React.useState("")
  const [sent, setSent] = React.useState(false)

  const handleSubmit = () => {
    if (!name || !email || !message) {
      alert("Please fill all fields")
      return
    }

    setSent(true)

    setTimeout(() => {
      setSent(false)
      setName("")
      setEmail("")
      setMessage("")
    }, 3000)
  }

  return (
    <div className="contact-container">

      <div className="left-section">
        <h1>Let's <span>Sync</span><br/>Up.</h1>
        <p>Reach out for support, partnerships, or anything music.</p>
      </div>

      <div className="form-box">
        <h3>Send a Message</h3>

        <input
          placeholder="Name"
          value={name}
          onChange={(e) => setName(e.target.value)}
        />

        <input
          placeholder="Email"
          value={email}
          onChange={(e) => setEmail(e.target.value)}
        />

        <select value={topic} onChange={(e) => setTopic(e.target.value)}>
          <option>General Inquiry</option>
          <option>Technical Support</option>
          <option>Artist Partnership</option>
        </select>

        <textarea
          placeholder="Your message"
          value={message}
          onChange={(e) => setMessage(e.target.value)}
        />

        <button className="submit-btn" onClick={handleSubmit}>
          {sent ? "✓ MESSAGE SENT!" : "SEND MESSAGE"}
        </button>
      </div>

    </div>
  )
}

const root = ReactDOM.createRoot(document.getElementById("root"))
root.render(<ContactPage />)

</script>

</body>
</html>
