<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BeatFlow Player</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700&family=DM+Sans:wght@400&display=swap" rel="stylesheet">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

/* 🎵 FLOATING MUSIC NOTES */
.notes {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

.note {
  position: absolute;
  font-size: 28px;
  color: rgba(192,132,252,0.25);
  animation: floatNote 8s linear infinite;
}

@keyframes floatNote {
  0% { transform: translateY(0); opacity: 0; }
  30% { opacity: 1; }
  100% { transform: translateY(-200px); opacity: 0; }
}

.n1 { left: 10%; bottom: 0; animation-delay: 0s; }
.n2 { left: 30%; bottom: 0; animation-delay: 1s; }
.n3 { left: 60%; bottom: 0; animation-delay: 1s; }
.n4 { left: 80%; bottom: 0; animation-delay: 1s; }
.n5 { left: 50%; bottom: 0; animation-delay: 0s; }
.n6 { left: 54%; bottom: 0; animation-delay: 2s; }
.n7{ left: 81%; bottom: 0; animation-delay: 2s; }
.n8 { left: 90%; bottom: 0; animation-delay: 1s; }

body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;

  background:
    radial-gradient(circle at 20% 30%, rgba(192,132,252,0.18), transparent 60%),
    radial-gradient(circle at 80% 70%, rgba(129,140,248,0.15), transparent 60%),
    radial-gradient(circle at 50% 10%, rgba(244,114,182,0.10), transparent 55%);
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;

  background-image: radial-gradient(circle, rgba(255,255,255,0.04) 1px, transparent 1px);
  background-size: 32px 32px;
}

.sidebar, .main { position: relative; z-index: 1; }

body {
  font-family: 'DM Sans', sans-serif;
  background-color: #0a0a0f;
  color: rgba(255,255,255,0.8);
  display: flex;
  height: 100vh;
  overflow: hidden;
}

.sidebar {
  width: 230px;
  min-width: 230px;
  height: 100vh;
  background: rgba(14, 14, 20, 0.85);
  backdrop-filter: blur(20px);
  border-right: 1px solid rgba(255,255,255,0.06);
  padding: 28px 16px;
  display: flex;
  flex-direction: column;
}

.logo { display: flex; align-items: center; gap: 12px; margin-bottom: 30px; }
.logo-icon {
  width: 42px; height: 42px;
  background: linear-gradient(135deg, #c084fc, #818cf8);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 20px rgba(192,132,252,0.35);
}
.logo-text h2 { font-family: 'Syne', sans-serif; font-size: 17px; font-weight: 800; color: #f1f0ff; }
.logo-text p { font-size: 10px; color: rgba(192,132,252,0.7); }

.menu { list-style: none; display: flex; flex-direction: column; gap: 6px; }
.menu li {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 14px; border-radius: 10px;
  cursor: pointer; color: rgba(255,255,255,0.45);
  transition: 0.2s;
}
.menu li:hover { color: #fff; background: rgba(192,132,252,0.1); }
.menu li.active { color: #fff; background: rgba(192,132,252,0.18); }

.main {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
}

.player-card {
  display: flex;
  align-items: center;
  gap: 50px;
  padding: 50px 60px;
  background: rgba(20, 16, 35, 0.85);
  border-radius: 28px;
  border: 1px solid rgba(255,255,255,0.06);
  box-shadow: 0 0 60px rgba(192,132,252,0.15);
}

.album-art {
  width: 240px;
  height: 240px;
  border-radius: 18px;
  object-fit: cover;
}

.track-title {
  font-family: 'Syne', sans-serif;
  font-size: 42px;
  font-weight: 800;
  color: #f1f0ff;
}

.track-artist {
  font-size: 14px;
  color: #c084fc;
  margin-bottom: 20px;
}

/* 🔥 PROGRESS BAR */
#progressBar {
  width: 100%;
  height: 4px;
  margin: 15px 0;
  -webkit-appearance: none;
  appearance: none;
  cursor: pointer;
  background: linear-gradient(
    to right,
    #c084fc 0%,
    #c084fc var(--progress),
    rgba(255,255,255,0.1) var(--progress),
    rgba(255,255,255,0.1) 100%
  );
}

#progressBar::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px;
  height: 12px;
  background: #c084fc;
  border-radius: 50%;
}

.controls {
  display: flex;
  align-items: center;
  gap: 18px;
}

.btn-skip {
  background: none;
  border: none;
  color: rgba(255,255,255,0.4);
  font-size: 20px;
  cursor: pointer;
  transition: all 0.2s ease;
}
.btn-skip:hover {
  color: #c084fc;
  transform: scale(1.1);
}
.btn-play {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: linear-gradient(135deg, #c084fc, #818cf8);
  border: none;
  color: white;
  font-size: 22px;
  cursor: pointer;
}
/* 🎚️ VOLUME SLIDER PURPLE */
/* 🎚️ VOLUME SLIDER - FULL PURPLE LINE */
#volumeSlider {
  -webkit-appearance: none;
  appearance: none;
  height: 4px;
  border-radius: 2px;
  cursor: pointer;
  background: rgba(192,132,252,0.4);
}

#volumeSlider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px;
  height: 12px;
  background: #c084fc;
  border-radius: 50%;
  box-shadow: 0 0 6px rgba(192,132,252,0.7);
}
/* ========================= */
/* 📱 RESPONSIVE DESIGN */
/* ========================= */

/* Tablet */
@media (max-width: 1024px) {

  .sidebar {
    width: 200px;
    min-width: 200px;
  }

  .player-card {
    padding: 30px;
    gap: 30px;
  }

  .album-art {
    width: 180px;
    height: 180px;
  }

  .track-title {
    font-size: 28px;
  }
}

/* Mobile */
@media (max-width: 768px) {

  body {
    flex-direction: column;
    height: auto;
  }

  .sidebar {
    width: 100%;
    height: auto;
    flex-direction: row;
    justify-content: space-between;
    padding: 16px;
  }

  .menu {
    flex-direction: row;
    gap: 10px;
  }

  .menu li {
    padding: 8px 10px;
    font-size: 12px;
  }

  .main {
    padding: 20px;
  }

  .player-card {
    flex-direction: column;
    text-align: center;
    padding: 25px;
    gap: 20px;
  }

  .album-art {
    width: 160px;
    height: 160px;
  }

  .track-title {
    font-size: 24px;
  }

  .controls {
    justify-content: center;
  }
}

/* Small Mobile */
@media (max-width: 480px) {

  .logo-text h2 {
    font-size: 14px;
  }

  .logo-text p {
    font-size: 8px;
  }

  .album-art {
    width: 130px;
    height: 130px;
  }

  .track-title {
    font-size: 20px;
  }

  .btn-play {
    width: 50px;
    height: 50px;
    font-size: 18px;
  }

  .btn-skip {
    font-size: 16px;
  }

  #progressBar {
    height: 3px;
  }
}
</style>
</head>

<body>

<div class="notes">
  <div class="note n1">🎵</div>
  <div class="note n2">🎶</div>
  <div class="note n3">🎵</div>
  <div class="note n4">🎶</div>
  <div class="note n5">🎵</div>
  <div class="note n6">🎶</div>
  <div class="note n7">🎵</div>
  <div class="note n8">🎶</div>

</div>

<div class="sidebar">
  <div class="logo">
    <div class="logo-icon">🎵</div>
    <div class="logo-text">
      <h2>BeatFlow</h2>
      <p>Premium Sound</p>
    </div>
  </div>
  <ul class="menu">
    <li onclick="window.location.href='/'">🏠 Home</li>
    <li onclick="window.location.href='/'">🎵 Library</li>
    <li onclick="window.location.href='/about.html'">📈 About</li>
    <li onclick="window.location.href='/contact.html'">✉️ Contact</li>
  </ul>
</div>

<div class="main">
  <div class="player-card">

    <img id="img" class="album-art" src="" />

    <div>
      <div id="title" class="track-title">No Song</div>
      <div id="artist" class="track-artist">Select a song</div>

      <!-- 🔥 PROGRESS BAR -->
      <input type="range" id="progressBar" value="0" min="0" max="100">

      <div class="controls">
        <button class="btn-skip" onclick="rewind()">⏮</button>
        <button class="btn-play" id="playBtn" onclick="togglePlay()">▶</button>
        <button class="btn-skip" onclick="forward()">⏭</button>

        <div class="volume">
          🔊
          <input type="range" min="0" max="1" step="0.01" value="0.8" id="volumeSlider" oninput="changeVolume(this)" />
        </div>
      </div>
    </div>

  </div>
</div>

<script>
let audio = null
let currentSong = null

const progressBar = document.getElementById("progressBar")
const playBtn = document.getElementById("playBtn")

// LOAD SONG FROM LOCALSTORAGE
function loadSong(){
  const data = localStorage.getItem("currentSong")
  if (!data) return

  const song = JSON.parse(data)

  if (currentSong && currentSong.title === song.title) return
  currentSong = song

  document.getElementById("title").innerText = song.title
  document.getElementById("artist").innerText = song.artist
  document.getElementById("img").src = song.image

  if (audio) audio.pause()
  audio = new Audio(song.audio)

  const savedTime = parseFloat(localStorage.getItem("currentTime")) || 0
  const shouldPlay = localStorage.getItem("isPlaying") === "true"

  audio.currentTime = savedTime

  // 🔥 AUTO BUTTON SYNC
  audio.onplay = () => playBtn.innerText = "⏸"
  audio.onpause = () => playBtn.innerText = "▶"

  if (shouldPlay) {
    audio.play().catch(() => {})
  }

  attachProgress()
}

// 🔥 TOGGLE FIXED (NO isPlaying)
function togglePlay(){
  if(!audio) return

  if(audio.paused){
    audio.play()
    localStorage.setItem("isPlaying", "true")
  } else {
    audio.pause()
    localStorage.setItem("isPlaying", "false")
  }
}

// CONTROLS
function rewind(){ if(audio) audio.currentTime -= 10 }
function forward(){ if(audio) audio.currentTime += 10 }

function changeVolume(el){
  if(audio) audio.volume = parseFloat(el.value)
}

// 🔥 PROGRESS FIXED
function attachProgress(){
  if (!audio) return

  audio.ontimeupdate = () => {
    if (!audio.duration) return

    const value = (audio.currentTime / audio.duration) * 100
    progressBar.value = value
    progressBar.style.setProperty('--progress', value + '%')

    localStorage.setItem("currentTime", audio.currentTime)
  }

  progressBar.oninput = () => {
    if (!audio.duration) return

    audio.currentTime = (progressBar.value / 100) * audio.duration
  }
}

// 🔥 CONTINUOUS SYNC
// setInterval(loadSong, 300)
window.onload = () => {
  const data = localStorage.getItem("currentSong")

  if (!data) {
    document.getElementById("title").innerText = "No Song"
    document.getElementById("artist").innerText = "Select a song"
    return
  }

  loadSong() // 🔥 LOAD SONG ONCE
}
</script>

</body>
</html>
